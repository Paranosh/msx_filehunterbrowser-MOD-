name: Build FH.COM

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:   # Permite lanzarlo manualmente desde GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout con submodulos
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar dependencias
        run: sudo apt-get update -qq && sudo apt-get install -y xxd

      - name: Pull imagen Docker SDCC
        run: docker pull nataliapc/sdcc:4.2.0

      - name: Extraer hex2bin de la imagen Docker
        run: |
          docker create --name temp_sdcc nataliapc/sdcc:4.2.0
          sudo docker cp temp_sdcc:/usr/local/bin/hex2bin /usr/local/bin/hex2bin
          docker rm temp_sdcc
          sudo chmod +x /usr/local/bin/hex2bin
          hex2bin -v || true

      - name: Generar recursos (res) antes del wildcard de utils.lib
        run: make res

      - name: Compilar FH.COM
        run: make all

      - name: Subir FH.COM como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: fh-com
          path: obj/fh.com
          retention-days: 30
