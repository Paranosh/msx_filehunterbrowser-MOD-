name: Build FH.COM

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:   # Permite lanzarlo manualmente desde GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout con submodulos
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xxd srecord
          # hex2bin no está en apt; usamos srec_cat (de srecord) con un wrapper
          # que emula la sintaxis del Makefile: hex2bin -e com file.ihx -> file.com
          sudo tee /usr/local/bin/hex2bin > /dev/null << 'EOF'
          #!/bin/bash
          EXT="$2"
          IHX="$3"
          OUT="${IHX%.ihx}.$EXT"
          srec_cat "$IHX" -Intel -o "$OUT" -Binary
          EOF
          sudo chmod +x /usr/local/bin/hex2bin

      - name: Pull imagen Docker SDCC
        run: docker pull nataliapc/sdcc:4.2.0

      - name: Compilar FH.COM
        run: make all

      - name: Subir FH.COM como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: fh-com
          path: |
            obj/fh.com
            dsk/fh.com
          retention-days: 30
