name: Build FH.COM

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:   # Permite lanzarlo manualmente desde GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout con submodulos
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar dependencias
        run: sudo apt-get update -qq && sudo apt-get install -y xxd

      - name: Instalar hex2bin (Python)
        run: |
          sudo tee /usr/local/bin/hex2bin > /dev/null << 'PYEOF'
          #!/usr/bin/env python3
          import sys, struct

          def ihx_to_bin(ihx_path, bin_path):
              data = {}
              base_addr = 0
              with open(ihx_path, 'r') as f:
                  for line in f:
                      line = line.strip()
                      if not line.startswith(':'):
                          continue
                      length = int(line[1:3], 16)
                      addr   = int(line[3:7], 16) + base_addr
                      rtype  = int(line[7:9], 16)
                      payload = bytes(int(line[9+i*2:11+i*2], 16) for i in range(length))
                      if rtype == 0x00:
                          for i, b in enumerate(payload):
                              data[addr + i] = b
                      elif rtype == 0x01:
                          break
                      elif rtype == 0x02:
                          base_addr = struct.unpack('>H', payload)[0] << 4
                      elif rtype == 0x04:
                          base_addr = struct.unpack('>H', payload)[0] << 16
              if not data:
                  return
              lo = min(data.keys())
              hi = max(data.keys())
              buf = bytearray([0xFF] * (hi - lo + 1))
              for addr, b in data.items():
                  buf[addr - lo] = b
              with open(bin_path, 'wb') as f:
                  f.write(buf)

          # Sintaxis: hex2bin -e EXT file.ihx
          if sys.argv[1] == '-e':
              ext      = sys.argv[2]
              ihx_path = sys.argv[3]
              bin_path = ihx_path.rsplit('.', 1)[0] + '.' + ext
          else:
              ihx_path = sys.argv[1]
              bin_path = sys.argv[2]

          ihx_to_bin(ihx_path, bin_path)
          PYEOF
          sudo chmod +x /usr/local/bin/hex2bin

      - name: Pull imagen Docker SDCC
        run: docker pull nataliapc/sdcc:4.2.0

      - name: Generar recursos (res) antes del wildcard de utils.lib
        run: make res

      - name: Compilar FH.COM
        run: make all

      - name: Subir FH.COM como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: fh-com
          path: obj/fh.com
          retention-days: 30
